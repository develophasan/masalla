<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çevrimdışı - Masal Sepeti</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #c4b5fd;
    }
    p {
      font-size: 16px;
      color: #a5b4fc;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #8b5cf6;
      color: white;
      text-decoration: none;
      border-radius: 9999px;
      font-weight: 600;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📚</div>
    <h1>Çevrimdışısınız</h1>
    <p>İnternet bağlantınız yok gibi görünüyor. Masalları görüntülemek için lütfen internet bağlantınızı kontrol edin.</p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">Tekrar Dene</a>
  </div>
</body>
</html>
